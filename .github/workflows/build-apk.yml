# .github/workflows/build-apk.yml
name: Build Ionic Notes Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull the source code from GitHub
      - name: Checkout project
        uses: actions/checkout@v4

      # 2. Set up Node.js 22 runtime
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. Cleanly install npm dependencies from package-lock.json
      - name: Install npm dependencies
        run: npm ci

      # 4. Compile the Vue 3 application into the dist folder
      - name: Build Ionic application
        run: npm run build

      # 5. Set up Java 21 (Required by Capacitor 8 for Android compilation)
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 6. Verify Java setup
      - name: Check Java version
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      # 7. Copy web bundle and dependencies into the native android folder
      - name: Sync Capacitor Android
        run: npx cap sync android

      # 8. Grant execution permissions to Gradle wrapper
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # 9. Verify Gradle environment
      - name: Check Gradle version
        working-directory: android
        run: ./gradlew --version

      # 10. Build the debug APK package
      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug

      # 11. Copy and rename the compiled APK artifact
      - name: Copy generated APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk IonicNotes.apk

      # 12. Upload downloadable APK to GitHub Actions Artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IonicNotes-APK
          path: IonicNotes.apk
          if-no-files-found: error
          retention-days: 30